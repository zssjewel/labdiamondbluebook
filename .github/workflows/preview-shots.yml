name: Preview screenshots

# 每次推到 main：構建網站、在電腦和手機寬度截圖、跑 Taste 版面檢查，
# 結果放到 shots 分支，方便在不能直接訪問網站的環境裡檢查效果。
on:
  push:
    branches: [main, warm-preview]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: preview-shots-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  shots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build static export
        id: build
        run: |
          mkdir -p shots
          set -o pipefail
          npm run build 2>&1 | tee shots/build.log
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          NEXT_PUBLIC_SITE_URL: https://labdiamondbluebook.com

      - name: Serve
        if: steps.build.outcome == 'success'
        run: |
          cp -f out/zh-hk.html out/index.html 2>/dev/null || cp -f out/zh-hk/index.html out/index.html
          head -c 4000 out/zh-hk/4c/carat-size-on-hand.html > shots/head.html || true
          (cd out && python3 -m http.server 8080 >/dev/null 2>&1 &)
          sleep 2

      - name: Screenshots
        if: steps.build.outcome == 'success'
        run: |
          npx -y playwright@1.55.0 install --with-deps chromium firefox webkit >/dev/null
          mkdir -p shots
          pages="home:zh-hk.html chapter:zh-hk/basics.html article:zh-hk/basics/vs-natural-moissanite.html about:zh-hk/about.html hand:zh-hk/4c/carat-size-on-hand.html price:zh-hk/price.html cases:zh-hk/cases.html certificate:zh-hk/certificate.html custom:zh-hk/custom.html igi:zh-hk/certificate/igi-or-gia.html process:zh-hk/custom/process.html"
          for p in $pages; do
            name="${p%%:*}"; path="${p#*:}"
            npx -y playwright@1.55.0 screenshot --full-page --wait-for-timeout 1500 --viewport-size "1440,900" "http://localhost:8080/$path" "shots/${name}-1440.png" || true
            npx -y playwright@1.55.0 screenshot --full-page --wait-for-timeout 1500 --device "Pixel 7" "http://localhost:8080/$path" "shots/${name}-390.png" || true
          done
          # 大屏幕和不同瀏覽器內核
          for p in home:zh-hk.html article:zh-hk/basics/vs-natural-moissanite.html; do
            name="${p%%:*}"; path="${p#*:}"
            for w in 320 768 1280 1920 2560; do
              npx -y playwright@1.55.0 screenshot --wait-for-timeout 1500 --viewport-size "$w,1000" "http://localhost:8080/$path" "shots/${name}-chromium-${w}.png" || true
            done
            npx -y playwright@1.55.0 screenshot -b firefox --wait-for-timeout 2000 --viewport-size "1440,1000" "http://localhost:8080/$path" "shots/${name}-firefox-1440.png" || true
            npx -y playwright@1.55.0 screenshot -b webkit --wait-for-timeout 2000 --viewport-size "1440,1000" "http://localhost:8080/$path" "shots/${name}-webkit-1440.png" || true
          done
          ls -la shots

      - name: Scroll performance
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: |
          npm i --no-save --prefix /tmp/pw playwright@1.55.0 >/dev/null 2>&1
          NODE_PATH=/tmp/pw/node_modules node scripts/perf.cjs http://localhost:8080 | tee shots/perf.txt

      - name: Pre-release checks
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: |
          [ -d /tmp/pw/node_modules/playwright ] || npm i --no-save --prefix /tmp/pw playwright@1.55.0 >/dev/null 2>&1
          NODE_PATH=/tmp/pw/node_modules node scripts/check.cjs http://localhost:8080 | tee shots/check.txt
          NODE_PATH=/tmp/pw/node_modules node scripts/load.cjs http://localhost:8080 | tee shots/load.txt
          NODE_PATH=/tmp/pw/node_modules node scripts/hand-shots.cjs http://localhost:8080 shots/hand | tee shots/hand.txt

      - name: Taste inspector
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: |
          git clone -q --depth=1 https://github.com/Leonxlnx/taste-skill /tmp/taste
          node /tmp/taste/skills/taste-skill/scripts/inspect.mjs http://localhost:8080/zh-hk.html --allow glass,button-fx,hairline,outlined-box,numbering,all-centred,size-count > shots/inspect.txt 2>&1 || true
          cp -r .taste-skill/inspect shots/inspect 2>/dev/null || true
          tail -60 shots/inspect.txt

      - name: Publish to shots branch
        if: always()
        run: |
          cd shots
          git init -q
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          echo "${GITHUB_SHA}" > COMMIT
          git add -A
          git commit -qm "Screenshots for ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:${{ github.ref_name == 'main' && 'shots' || format('shots-{0}', github.ref_name) }}
