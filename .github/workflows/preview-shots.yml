name: Preview screenshots

# 每次推到 main：構建網站、在電腦和手機寬度截圖、跑 Taste 版面檢查，
# 結果放到 shots 分支，方便在不能直接訪問網站的環境裡檢查效果。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: preview-shots
  cancel-in-progress: true

jobs:
  shots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build static export
        run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          NEXT_PUBLIC_SITE_URL: https://labdiamondbluebook.com

      - name: Serve
        run: |
          cp -f out/zh-hk.html out/index.html 2>/dev/null || cp -f out/zh-hk/index.html out/index.html
          (cd out && python3 -m http.server 8080 >/dev/null 2>&1 &)
          sleep 2

      - name: Screenshots
        run: |
          npx -y playwright@1.55.0 install --with-deps chromium >/dev/null
          mkdir -p shots
          pages="home:zh-hk.html chapter:zh-hk/basics.html article:zh-hk/basics/vs-natural-moissanite.html about:zh-hk/about.html"
          for p in $pages; do
            name="${p%%:*}"; path="${p#*:}"
            npx -y playwright@1.55.0 screenshot --full-page --wait-for-timeout 2500 --viewport-size "1440,900" "http://localhost:8080/$path" "shots/${name}-1440.png" || true
            npx -y playwright@1.55.0 screenshot --full-page --wait-for-timeout 2500 --device "iPhone 13" "http://localhost:8080/$path" "shots/${name}-390.png" || true
          done
          ls -la shots

      - name: Taste inspector
        continue-on-error: true
        run: |
          git clone -q --depth=1 https://github.com/Leonxlnx/taste-skill /tmp/taste
          node /tmp/taste/skills/taste-skill/scripts/inspect.mjs http://localhost:8080/zh-hk.html > shots/inspect.txt 2>&1 || true
          cp -r .taste-skill/inspect shots/inspect 2>/dev/null || true
          tail -60 shots/inspect.txt

      - name: Publish to shots branch
        run: |
          cd shots
          git init -q
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          echo "${GITHUB_SHA}" > COMMIT
          git add -A
          git commit -qm "Screenshots for ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:shots
